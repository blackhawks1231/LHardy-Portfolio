<!DOCTYPE html>

<body>
    <header>
        <h1>Contact Me</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact Me</a>
        </nav>
    </header>

<section id="contact">
  <h2>Contact Me</h2>
  <p>Have a question or want to chat? Send me a message!</p>

  <form
    class="contact-form"
    action="https://formspree.io/f/mjygaekk"
    method="post"
  >
    <label for="name">Your Name</label>
    <input
      type="text"
      id="name"
      name="name"
      placeholder="Enter your name"
      required
    >

    <label for="email">Your Email</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="you@example.com"
      required
    >

    <label for="subject">Subject</label>
    <input
      type="text"
      id="subject"
      name="subject"
      placeholder="What's this about?"
      required
    >

    <label for="message">Your Message</label>
    <textarea
      id="message"
      name="message"
      rows="6"
      placeholder="Write your message here..."
      required
    ></textarea>

    <button type="submit" class="contact-button">
      Send Message
    </button>
  </form>
</section>

</body>
</html>
